spring.application.name=food-delivery-backend

# Server Configuration
server.port=8080

# PostgreSQL Configuration (production)
spring.datasource.url=jdbc:postgresql://localhost:5432/food_delivery
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
# WARNING: Change this secret in production! Use environment variables.
jwt.secret=mySecretKeyForJwtTokenGeneration12345678901234567890
jwt.expiration=86400000

